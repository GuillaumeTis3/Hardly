moi.text= "Bonjour, je m'appelle Guillaume Gaspard, diplômé TIS en 2017, je suis chef de projet Interopérabilité. \nPour mon stage de fin d'études, je me suis lancé dans l'interopérabilité... Eh quelle découverte ! Aujourd'hui j'en suis passionné. \nN'hésitez pas à me demander les sources. Ps : je suis très mauvais développeur."
